<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605 185" role="img" aria-labelledby="title desc">
<title id="title">Don's Digital Cards</title><desc id="desc">Don's Digital Cards neon trading card logo</desc>
<defs>
<linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20d9ff"/><stop offset=".55" stop-color="#5b74ff"/><stop offset="1" stop-color="#7c4cff"/></linearGradient>
<linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b4dff"/><stop offset="1" stop-color="#e04dff"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e8f4ff"/><stop offset="1" stop-color="#a9c4dc"/></linearGradient>
<linearGradient id="purpleText" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8eaff"/><stop offset=".48" stop-color="#6f82ff"/><stop offset="1" stop-color="#c66aff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<g filter="url(#glow)" transform="translate(5 12)">
  <rect x="28" y="20" width="80" height="112" rx="8" fill="#071126" stroke="url(#cardBlue)" stroke-width="4" transform="rotate(-17 68 76)"/>
  <rect x="49" y="10" width="82" height="114" rx="8" fill="#0a1630" stroke="#8558ff" stroke-width="4" transform="rotate(-3 90 67)"/>
  <rect x="71" y="18" width="82" height="114" rx="8" fill="#090d26" stroke="url(#cardPurple)" stroke-width="4" transform="rotate(13 112 75)"/>
  <path d="M19 92 C45 57 78 43 111 39" fill="none" stroke="#22d7ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M25 105 C52 80 80 69 111 67" fill="none" stroke="#5b72ff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
</g>
<g filter="url(#glow)">
  <text x="150" y="78" fill="url(#silver)" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="900" letter-spacing="1.5">DON'S</text>
  <text x="150" y="127" fill="url(#purpleText)" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="900" letter-spacing="1.2">DIGITAL CARDS</text>
  <path d="M150 139 H555" stroke="url(#purpleText)" stroke-width="2" opacity=".7"/>
  <path d="M554 139 l18 -10 -7 16 17 3 -19 4 1 17 -11 -14 -14 9 8 -15 -14 -7 17 1z" fill="#c45cff"/>
  <path d="M558 126 l8 -13 4 11 12 2 -11 5 1 13 -8 -10 -10 6 5 -10 -10 -5z" fill="#7b61ff" opacity=".85"/>
</g>
</svg>