<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
<title id="title">Don's Digital Cards</title><desc id="desc">Don's Digital Cards futuristic neon chrome logo</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03091b"/><stop offset=".48" stop-color="#10114a"/><stop offset="1" stop-color="#23082e"/></linearGradient>
 <radialGradient id="nebula" cx=".72" cy=".52" r=".7"><stop stop-color="#5b45c8" stop-opacity=".42"/><stop offset=".45" stop-color="#242d9c" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="cardCyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#18dcff"/><stop offset=".55" stop-color="#536bff"/><stop offset="1" stop-color="#b14cff"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".18" stop-color="#b9d7ec"/><stop offset=".4" stop-color="#ffffff"/><stop offset=".62" stop-color="#7f9ab5"/><stop offset=".82" stop-color="#f8fdff"/><stop offset="1" stop-color="#a9c2d8"/></linearGradient>
 <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71e9ff"/><stop offset=".45" stop-color="#7891ff"/><stop offset="1" stop-color="#e866ff"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="smallglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="90" height="70" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1.2" fill="#fff" opacity=".55"/><circle cx="57" cy="43" r=".9" fill="#8deaff" opacity=".45"/><circle cx="78" cy="9" r=".8" fill="#d5a5ff" opacity=".5"/></pattern>
</defs>
<rect width="1200" height="405" rx="28" fill="url(#bg)"/>
<rect width="1200" height="405" rx="28" fill="url(#nebula)"/>
<rect width="1200" height="405" rx="28" fill="url(#stars)" opacity=".55"/>
<ellipse cx="760" cy="350" rx="390" ry="30" fill="#8c45ff" opacity=".14" filter="url(#glow)"/>

<!-- three-card fan -->
<g fill="#070e27" stroke="url(#cardCyan)" stroke-width="6" filter="url(#glow)">
 <rect x="88" y="91" width="150" height="218" rx="15" transform="rotate(-17 163 200)"/>
 <rect x="128" y="72" width="150" height="218" rx="15" transform="rotate(-4 203 181)"/>
 <rect x="170" y="88" width="150" height="218" rx="15" transform="rotate(11 245 197)"/>
</g>
<g fill="none" stroke="url(#cardCyan)" stroke-width="4" opacity=".8" filter="url(#smallglow)">
 <rect x="107" y="112" width="112" height="174" rx="10" transform="rotate(-17 163 199)"/>
 <rect x="147" y="93" width="112" height="174" rx="10" transform="rotate(-4 203 180)"/>
 <rect x="189" y="109" width="112" height="174" rx="10" transform="rotate(11 245 196)"/>
</g>
<path d="M55 278 C125 196 194 150 300 135" fill="none" stroke="url(#cardCyan)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
<path d="M73 307 C145 247 215 211 298 190" fill="none" stroke="#684cff" stroke-width="4" stroke-linecap="round" opacity=".75"/>

<!-- chrome wordmark -->
<g filter="url(#smallglow)" font-family="Arial,Helvetica,sans-serif" font-weight="900">
 <text x="335" y="192" font-size="116" letter-spacing="4" fill="url(#chrome)" stroke="#dff7ff" stroke-opacity=".18" stroke-width="2">DON'S</text>
 <text x="342" y="270" font-size="67" letter-spacing="3" fill="url(#sub)">DIGITAL CARDS</text>
</g>
<path d="M343 292 H1060" stroke="url(#sub)" stroke-width="4" filter="url(#smallglow)"/>
<g fill="url(#sub)" filter="url(#glow)">
 <path d="M1080 278l9 20 22 3-17 15 5 22-19-11-20 11 5-22-17-15 22-3z"/>
 <circle cx="1040" cy="103" r="3"/><circle cx="1080" cy="77" r="2.5"/><circle cx="1110" cy="126" r="2"/>
</g>
</svg>