<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Don's Digital Cards</title><desc id="desc">Neon chrome trading card logo</desc>
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#d9e9ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".72" stop-color="#8fb9e8"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="blueviolet" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#18d9ff"/><stop offset=".52" stop-color="#5b7cff"/><stop offset="1" stop-color="#e83cff"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-50%" width="180%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<!-- original card-stack mark, kept left of the name for header readability -->
<g transform="translate(28 38)" fill="none" stroke="url(#blueviolet)" stroke-width="9" stroke-linejoin="round" filter="url(#glow)">
  <rect x="18" y="32" width="112" height="156" rx="12" transform="rotate(-18 74 110)"/>
  <rect x="42" y="18" width="112" height="156" rx="12" transform="rotate(-8 98 96)"/>
  <rect x="66" y="10" width="112" height="156" rx="12" transform="rotate(3 122 88)"/>
</g>
<path d="M38 205 C170 238 260 230 350 211" fill="none" stroke="url(#blueviolet)" stroke-width="5" opacity=".9" filter="url(#soft)"/>
<g font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic">
  <text x="235" y="127" font-size="108" letter-spacing="3" fill="url(#chrome)" stroke="#173b72" stroke-width="7" paint-order="stroke" filter="url(#glow)">DON’S</text>
  <text x="242" y="193" font-size="52" letter-spacing="7" fill="url(#chrome)" stroke="#233e74" stroke-width="3" paint-order="stroke">DIGITAL CARDS</text>
</g>
<path d="M235 210 H955" stroke="url(#blueviolet)" stroke-width="4" filter="url(#soft)"/>
</svg>